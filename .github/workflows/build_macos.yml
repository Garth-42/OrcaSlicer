name: Build macOS (arm64)

on:
  workflow_dispatch: # allows for manual dispatch
    inputs:
      build-deps-only:
        description: 'Only build dependencies (bypasses caching)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # arm64-only macOS build; produces the OrcaSlicer_Mac_bundle_arm64_<sha>
  # artifact. The universal DMG (arm64 + x86_64) is only built by build_all.yml.
  build_macos_arm64:
    name: Build macOS arm64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || 'macos-14' }}
      arch: arm64
      build-deps-only: ${{ inputs.build-deps-only || false }}
    secrets: inherit
